<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>It's For You 💙</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Georgia, serif;
    background: linear-gradient(135deg, #dff6ff, #8ed8ff);
    overflow: hidden;
}

.card {
    text-align: center;
    background: rgba(255,255,255,0.75);
    padding: 50px 30px;
    width: 90%;
    max-width: 420px;
    border-radius: 30px;
    box-shadow: 0 10px 35px rgba(0,100,160,0.2);
}

h1 {
    color: #087bb5;
    font-size: 38px;
}

p {
    color: #398bb5;
    font-size: 20px;
}

button {
    border: none;
    background: #38aee8;
    color: white;
    padding: 15px 35px;
    border-radius: 30px;
    font-size: 18px;
    cursor: pointer;
}

button:active {
    transform: scale(0.95);
}

.heart {
    position: fixed;
    font-size: 25px;
    animation: float 5s linear infinite;
    opacity: 0.7;
}

@keyframes float {
    0% {
        transform: translateY(100vh);
    }
    100% {
        transform: translateY(-10vh);
    }
}
</style>
</head>

<body>

<div class="heart" style="left:10%; animation-delay:1s;">💙</div>
<div class="heart" style="left:30%; animation-delay:3s;">🩵</div>
<div class="heart" style="left:60%; animation-delay:0s;">💙</div>
<div class="heart" style="left:85%; animation-delay:2s;">🩵</div>

<div class="card">
    <h1>💙 IT'S FOR YOU</h1>
    <p>Something special is waiting for you... ✨</p>

    <button onclick="location.href='page2.html'">
        Touch to open 💙
    </button>
</div>

</body>
</html>
