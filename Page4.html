<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Love Anniversary 💙</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: white;
    font-family: Georgia, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
}

/* PAGE 4 PHOTO */
.page-photo {
    width: 100%;
    max-width: 650px;
    height: auto;
    display: block;
    object-fit: contain;
}

/* Next button */
.next {
    margin-top: 15px;
    margin-bottom: 20px;
    text-align: center;
}

.next button {
    border: none;
    background: #5da9d6;
    color: white;
    padding: 13px 30px;
    border-radius: 30px;
    font-size: 17px;
    box-shadow: 0 5px 15px rgba(0,80,150,0.25);
}

/* small floating animation */
.heart {
    position: fixed;
    font-size: 25px;
    animation: float 4s ease-in-out infinite;
    pointer-events: none;
}

.h1 {
    left: 10%;
    bottom: 20%;
}

.h2 {
    right: 12%;
    top: 30%;
    animation-delay: 1.5s;
}

@keyframes float {
    0%,100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-20px);
    }
}
</style>
</head>

<body>

<!-- ONLY ONE PAGE 4 IMAGE -->
<img src="childhood.jpg" class="page-photo" alt="Our Memories">

<!-- Animation -->
<div class="heart h1">💙</div>
<div class="heart h2">💙</div>

<!-- Next -->
<div class="next">
    <button onclick="location.href='page5.html'">
        Next → 💌
    </button>
</div>

</body>
</html>
