<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Forever 💙</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Georgia, serif;
}

/* FULL SCREEN PHOTO */
body {
    background-image: url("krishna.jpg");
    background-position: center center;
    background-size: cover;
    background-repeat: no-repeat;
    background-attachment: fixed;

    display: flex;
    justify-content: center;
    align-items: center;
}

/* LIGHT BLUE OVERLAY */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0, 70, 130, 0.08);
    z-index: 0;
}

/* TEXT */
.content {
    position: relative;
    z-index: 2;

    width: 90%;
    max-width: 650px;

    text-align: center;

    padding: 25px 20px;

    background: rgba(255,255,255,0.10);

    border-radius: 25px;

    animation: appear 2s ease;
}

/* MAIN QUOTE */
.quote {
    color: white;

    font-size: 30px;

    line-height: 1.4;

    font-weight: bold;

    text-shadow:
        0 3px 10px rgba(0,0,80,0.9);

    animation: glow 2s infinite alternate;
}

/* SMALL TEXT */
.small-text {
    margin-top: 18px;

    color: white;

    font-size: 18px;

    text-shadow:
        0 2px 8px rgba(0,0,80,0.9);
}

/* FLOATING HEARTS */
.float {
    position: fixed;

    z-index: 3;

    font-size: 25px;

    animation: float 4s ease-in-out infinite;
}

.f1 {
    left: 8%;
    top: 20%;
}

.f2 {
    right: 8%;
    top: 30%;
    animation-delay: 1s;
}

.f3 {
    left: 12%;
    bottom: 20%;
    animation-delay: 2s;
}

.f4 {
    right: 12%;
    bottom: 18%;
    animation-delay: 3s;
}


/* ANIMATIONS */

@keyframes appear {

    from {
        opacity: 0;
        transform: scale(0.9);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes glow {

    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.04);
    }
}

@keyframes float {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-20px);
    }
}


/* MOBILE */
@media (max-width: 600px) {

    .quote {
        font-size: 27px;
    }

    .small-text {
        font-size: 17px;
    }

}

</style>
</head>


<body>

<!-- LAST SONG -->
<audio id="bgMusic" autoplay loop>

    <source src="lastsong.mp3" type="audio/mpeg">

</audio>


<!-- FLOATING EFFECTS -->

<div class="float f1">💙</div>

<div class="float f2">🪷</div>

<div class="float f3">💙</div>

<div class="float f4">✨</div>


<!-- MESSAGE -->

<div class="content">

    <div class="quote">
        You are written in my destiny 🥹🫂💙🪷
    </div>

    <div class="small-text">
        Forever written in my heart... 💙
    </div>

</div>


<script>

/* TRY TO START MUSIC */

window.addEventListener("load", function() {

    const music = document.getElementById("bgMusic");

    music.volume = 0.5;

    music.play().catch(function() {
        console.log("Tap the page to start music");
    });

});


/* TOUCH ANYWHERE = MUSIC START */

document.addEventListener("click", function() {

    const music = document.getElementById("bgMusic");

    music.play().catch(function(){});

});


document.addEventListener("touchstart", function() {

    const music = document.getElementById("bgMusic");

    music.play().catch(function(){});

}, { once: true });

</script>

</body>

</html>
