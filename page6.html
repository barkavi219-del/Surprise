<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wedding Invitation 💍</title>

<style>

* {
    box-sizing: border-box;
}
body {
    margin: 0;
    min-height: 100vh;

    background:  url("background.jpg?v=4") center center / cover no-repeat fixed;

    display: flex;
    justify-content: center;
    align-items: center;
}

.invitation {
    width: 100%;
    max-width: 450px;
    background: rgba(255,255,255,0.92);
    padding: 20px;
    text-align: center;
    border-radius: 30px;
    box-shadow: 0 15px 40px rgba(0,100,150,0.2);
}

.invitation-img {
    width: 100%;
    max-width: 400px;
    height: auto;
    display: block;
    margin: 0 auto;
    border-radius: 20px;
}

.next-btn {
    margin-top: 25px;
    padding: 15px 40px;
    border: none;
    border-radius: 30px;
    background: #36aee0;
    color: white;
    font-size: 19px;
    cursor: pointer;
}

.next-btn:hover {
    transform: scale(1.05);
}

</head>

<body>

<div class="invitation">

    <img src="invitation.jpg" class="invitation-img" alt="Wedding Invitation">

    <a href="page7.html">
