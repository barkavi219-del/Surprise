<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Love Anniversary 💙</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background: url("background.jpg")
                center center / cover no-repeat fixed;

    font-family: Georgia, serif;

    display: flex;
    flex-direction: column;
    align-items: center;

    overflow-x: hidden;

    padding: 50px 15px;
}

/* Main card */

.card {
    width: 95%;
    max-width: 750px;

    background: rgba(255,255,255,0.94);

    border-radius: 25px;

    padding: 35px 25px 30px;

    text-align: center;

    box-shadow:
        0 10px 35px rgba(0,80,150,0.20);

    animation: appear 1.5s ease;
}

/* Heading */

h1 {
    margin: 0 0 25px;

    font-size: 32px;

    color: #111;

    font-weight: normal;

    line-height: 1.3;
}

/* Anniversary photo */

.anniversary-photo {
    width: 100%;
    max-width: 650px;

    height: auto;

    display: block;

    margin: 0 auto 25px;

    border-radius: 3px;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.12);
}

/* Togetherness text */

.together {
    display: inline-block;

    background: #d7c4b3;

    color: #704b32;

    padding: 16px 35px;

    border-radius: 30px;

    font-size: 20px;

    font-weight: bold;

    margin-top: 5px;
}

/* Heart */

.heart {
    font-size: 38px;

    margin-top: 8px;

    animation: heartbeat 1.5s infinite;
}

/* Next button */

.next-button {
    margin-top: 35px;

    padding: 15px 38px;

    border: none;

    border-radius: 30px;

    background: #4da9d8;

    color: white;

    font-size: 18px;

    cursor: pointer;

    box-shadow:
        0 5px 15px rgba(0,100,160,0.25);
}

.next-button:active {
    transform: scale(0.95);
}

/* Animation */

@keyframes appear {

    from {
        opacity: 0;
        transform: translateY(30px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes heartbeat {

    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.2);
    }
}

</style>
</head>

<body>

<!-- Music -->

<audio id="bgMusic" autoplay loop>
    <source src="music1.mp3" type="audio/mpeg">
</audio>


<!-- Page 4 content -->

<div class="card">

    <h1>
        Happy love anniversary<br>
        my loyal man 🫶🫂
    </h1>


    <!-- ONLY ONE PHOTO -->

    <img
        src="childhood.jpg"
        class="anniversary-photo"
        alt="Our Memory"
    >


    <div class="together">
        4 years of togetherness 🧿🥹💎♾️
    </div>

    <div class="heart">
        🤎
    </div>

</div>


<!-- Next -->

<button
    class="next-button"
    onclick="location.href='page5.html'">

    Next → 💌

</button>


<script>

/* Try to start music automatically */

window.addEventListener("load", function() {

    const music = document.getElementById("bgMusic");

    music.volume = 0.5;

    music.play().catch(function() {
        // Browser may block autoplay
    });

});

</script>

</body>
</html>
