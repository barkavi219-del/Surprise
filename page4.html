<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Love Anniversary 💙</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background: url("background.jpg") center center / cover no-repeat fixed;

    font-family: Georgia, serif;

    display: flex;
    justify-content: center;

    overflow-x: hidden;

    padding: 60px 15px 40px;
}

/* Main content */

.container {
    width: 100%;
    max-width: 700px;

    text-align: center;

    position: relative;
    z-index: 2;
}

/* Heading */

.title {
    color: #222;
    font-size: 30px;
    line-height: 1.3;

    margin: 80px 0 15px;

    animation: fadeIn 2s ease;
}

.subtitle {
    color: #222;
    font-size: 29px;

    margin-bottom: 15px;

    animation: fadeIn 2s ease;
}

/* Underline */

.line {
    width: 300px;
    max-width: 75%;

    height: 4px;

    background: #333;

    margin: 0 auto 45px;

    border-radius: 50%;

    transform: rotate(-2deg);
}

/* Childhood photo */

.memory-photo {
    width: 90%;
    max-width: 610px;

    height: auto;

    display: block;

    margin: 0 auto 55px;

    border-radius: 2px;

    box-shadow: 0 8px 25px rgba(0,0,0,0.15);

    animation: photoAppear 2s ease;
}

/* Togetherness box */

.together {
    display: inline-block;

    background: rgba(194,178,164,0.88);

    color: #704f38;

    padding: 22px 30px;

    border-radius: 30px;

    font-size: 20px;
    font-weight: bold;

    animation: pop 2s ease;
}

/* Heart */

.heart {
    font-size: 38px;

    margin-top: -8px;
    margin-left: 300px;

    animation: heartbeat 1.5s infinite;
}

/* Next button */

.next-area {
    margin-top: 70px;
    margin-bottom: 20px;
}

.next-button {
    border: none;

    background: #5da9d6;

    color: white;

    padding: 14px 35px;

    border-radius: 30px;

    font-size: 18px;

    cursor: pointer;

    box-shadow: 0 6px 15px rgba(0,100,160,0.25);

    transition: 0.3s;
}

.next-button:hover {
    transform: scale(1.08);
}

/* Floating animation */

.float {
    position: fixed;

    bottom: -50px;

    font-size: 25px;

    z-index: 1;

    animation: floatUp 7s linear infinite;

    opacity: 0.7;
}

.f1 {
    left: 10%;
    animation-delay: 0s;
}

.f2 {
    left: 30%;
    animation-delay: 2s;
}

.f3 {
    left: 55%;
    animation-delay: 4s;
}

.f4 {
    left: 80%;
    animation-delay: 1s;
}

@keyframes floatUp {

    0% {
        transform: translateY(0) scale(0.8);
        opacity: 0;
    }

    20% {
        opacity: 0.8;
    }

    100% {
        transform: translateY(-110vh) scale(1.2);
        opacity: 0;
    }

}

@keyframes heartbeat {

    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.2);
    }

}

@keyframes fadeIn {

    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

@keyframes photoAppear {

    from {
        opacity: 0;
        transform: scale(0.9);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }

}

@keyframes pop {

    from {
        opacity: 0;
        transform: scale(0.8);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }

}

/* Mobile */

@media (max-width: 600px) {

    body {
        padding-top: 35px;
    }

    .title {
        font-size: 27px;
        margin-top: 60px;
    }

    .subtitle {
        font-size: 25px;
    }

    .line {
        margin-bottom: 35px;
    }

    .memory-photo {
        width: 94%;
        margin-bottom: 40px;
    }

    .together {
        font-size: 17px;
        padding: 18px 20px;
    }

    .heart {
        margin-left: 180px;
    }

    .next-area {
        margin-top: 55px;
    }

}

</style>
</head>

<body>

<!-- Background floating animation -->

<div class="float f1">💙</div>
<div class="float f2">✨</div>
<div class="float f3">🫂</div>
<div class="float f4">💙</div>


<!-- Background music -->

<audio id="bgMusic" autoplay loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>


<div class="container">

    <div class="title">
        Happy love anniversary
    </div>

    <div class="subtitle">
        my loyal man 🫶 🫂
    </div>

    <div class="line"></div>


    <!-- Childhood photo -->

    <img
        src="childhood.jpg"
        class="memory-photo"
        alt="Our Childhood Memory"
    >


    <!-- Togetherness -->

    <div class="together">
        4 years of togetherness 🧿😚💎♾️
    </div>

    <div class="heart">
        🤎
    </div>


    <!-- Next -->

    <div class="next-area">

        <button
            class="next-button"
            onclick="location.href='page5.html'">

            Next → 💌

        </button>

    </div>

</div>


<script>

/* Try to start music automatically */

window.addEventListener("load", function() {

    const music = document.getElementById("bgMusic");

    music.volume = 0.5;

    music.play().catch(function() {
        /* Browser may block autoplay */
    });

});

</script>

</body>
</html>
