<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Little Hug 💙</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: url("background.jpg") center / cover no-repeat;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Georgia, serif;
    overflow: hidden;
}

.container {
    text-align: center;
    background: rgba(255,255,255,0.88);
    padding: 45px 25px;
    width: 90%;
    max-width: 500px;
    border-radius: 30px;
    box-shadow: 0 10px 35px rgba(0,80,160,0.25);
}

/* Hug animation */
.hug {
    font-size: 90px;
    display: inline-block;
    animation: hugMove 2s ease-in-out infinite;
}

@keyframes hugMove {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.15);
    }
}

h1 {
    color: #1672a8;
    font-size: 30px;
    margin: 20px 0 10px;
}

p {
    color: #333;
    font-size: 20px;
    line-height: 1.5;
}

.heart {
    font-size: 30px;
    animation: heartBeat 1.2s infinite;
}

@keyframes heartBeat {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.3);
    }
}

.next {
    margin-top: 30px;
}

.next button {
    border: none;
    background: #5da9d6;
    color: white;
    padding: 14px 32px;
    border-radius: 30px;
    font-size: 19px;
}
</style>
</head>

<body>

<div class="container">

    <div class="hug">🫂</div>

    <h1>Little Hug Animation</h1>

    <p>
        Sending you a big warm hug 💙
    </p>

    <div class="heart">💙</div>

    <div class="next">
        <button onclick="location.href='page4.html'">
            Next →
        </button>
    </div>

</div>

</body>
</html>
