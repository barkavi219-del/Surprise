<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Love Anniversary 💙</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: url("background.jpg") center center / cover no-repeat;
    font-family: Georgia, serif;
    text-align: center;
    padding: 45px 15px;
}

.page {
    width: 95%;
    max-width: 720px;
    margin: auto;
    background: rgba(255,255,255,0.93);
    padding: 45px 25px 55px;
    border-radius: 15px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.15);
}

/* Heading */
h1 {
    margin: 0;
    color: #111;
    font-size: 34px;
    font-weight: normal;
    line-height: 1.3;
}

h2 {
    margin: 0;
    color: #111;
    font-size: 31px;
    font-weight: normal;
    line-height: 1.3;
}

/* Hand-drawn style line */
.line {
    width: 370px;
    max-width: 85%;
    height: 25px;
    margin: 20px auto 50px;
    border-bottom: 4px solid #222;
    border-radius: 50%;
    transform: rotate(-2deg);
}

/* Photo */
.memory-photo {
    width: 95%;
    max-width: 610px;
    height: auto;
    display: block;
    margin: auto;
}

/* Togetherness */
.together {
    display: inline-block;
    margin-top: 70px;
    padding: 22px 38px;
    background: #cbb9aa;
    border-radius: 35px;
    color: #704b2d;
    font-size: 21px;
    font-weight: bold;
}

/* Next */
.next-page {
    margin-top: 45px;
}

.next-page button {
    border: none;
    padding: 14px 32px;
    border-radius: 30px;
    background: #8bbce0;
    color: white;
    font-size: 20px;
}
</style>
</head>

<body>

<!-- Background Music -->
<audio id="pageMusic" autoplay loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="page">

    <h1>Happy love anniversary</h1>

    <h2>my loyal man 🤝🫂</h2>

    <div class="line"></div>

    <img
        src="childhood.jpg"
        class="memory-photo"
        alt="Our Memory"
    >

    <div class="together">
        4 years of togetherness 🧿🤭💎♾️
    </div>

    <div class="next-page">
        <button onclick="location.href='page4.html'">
            Next →
        </button>
    </div>

</div>

<script>
window.addEventListener("load", function () {
    const music = document.getElementById("pageMusic");

    music.volume = 0.5;

    music.play().catch(function () {
        console.log("Autoplay blocked by browser");
    });
});
</script>

</body>
</html>
