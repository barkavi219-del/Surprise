<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Love Anniversary 💙</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    /* FIRST IMAGE - FULL SCREEN BACKGROUND */
    background: url("background.jpg") center center / cover no-repeat fixed;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    font-family: Georgia, serif;
    overflow-x: hidden;
}

/* Soft overlay */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.15);
    z-index: 0;
}

/* MAIN CARD */
.card {
    position: relative;
    z-index: 2;

    width: 92%;
    max-width: 850px;

    padding: 35px 20px;

    background: rgba(255,255,255,0.88);

    border-radius: 25px;

    text-align: center;

    box-shadow:
        0 15px 45px rgba(0,80,150,0.25);

    animation: appear 1.5s ease;
}

/* SECOND IMAGE - CENTER & BIG */
.love-photo {
    width: 95%;
    max-width: 760px;
    height: auto;

    display: block;
    margin: 20px auto 25px;

    border-radius: 5px;

    box-shadow:
        0 8px 25px rgba(0,0,0,0.20);

    animation: photoShow 2s ease;
}

/* NEXT BUTTON */
.next-button {
    position: relative;
    z-index: 5;

    margin-top: 25px;
    margin-bottom: 25px;

    padding: 14px 35px;

    border: none;
    border-radius: 30px;

    background: #36aee0;
    color: white;

    font-size: 18px;

    cursor: pointer;

    box-shadow:
        0 6px 15px rgba(0,100,160,0.25);

    transition: 0.3s;
}

.next-button:hover {
    transform: scale(1.08);
}

/* BACKGROUND ANIMATION */
.float {
    position: fixed;
    z-index: 3;

    font-size: 25px;

    animation: float 5s ease-in-out infinite;
}

.f1 {
    left: 8%;
    top: 25%;
}

.f2 {
    right: 8%;
    top: 40%;

    animation-delay: 1s;
}

.f3 {
    left: 15%;
    bottom: 20%;

    animation-delay: 2s;
}

.f4 {
    right: 15%;
    bottom: 25%;

    animation-delay: 3s;
}

@keyframes float {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-25px);
    }

}

@keyframes appear {

    from {
        opacity: 0;
        transform: translateY(30px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

@keyframes photoShow {

    from {
        opacity: 0;
        transform: scale(0.9);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }

}

/* MOBILE */
@media (max-width: 600px) {

    .card {
        width: 96%;
        padding: 25px 10px;
    }

    .love-photo {
        width: 98%;
    }

}

</style>
</head>

<body>

<!-- BACKGROUND ANIMATION -->
<div class="float f1">💙</div>
<div class="float f2">✨</div>
<div class="float f3">🩵</div>
<div class="float f4">💙</div>


<!-- MUSIC -->
<audio id="bgMusic" loop>
    <source src="music1.mp3" type="audio/mpeg">
</audio>


<!-- PAGE 4 CONTENT -->
<div class="card">

    <!-- YOUR SECOND PHOTO -->
    <img
        src="photo.jpg"
        class="love-photo"
        alt="Happy Love Anniversary"
    >

</div>


<!-- NEXT -->
<button
    class="next-button"
    onclick="location.href='page5.html'"
>
    Next → 💌
</button>


<script>

const music = document.getElementById("bgMusic");

/* Try to play when page opens */
window.addEventListener("load", function() {
    music.volume = 0.5;

    music.play().catch(function() {
        console.log("Autoplay blocked by browser");
    });
});

/* Touch anywhere on Page 4 → music starts */
document.addEventListener("click", function() {
    music.play().catch(function() {});
}, { once: true });

</script>

</body>
</html>
