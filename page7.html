<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Love Story 🎬</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Georgia, serif;
    background: linear-gradient(135deg, #bdefff, #eafaff);
    overflow: hidden;
}

.movie {
    width: 90%;
    max-width: 450px;
    text-align: center;
}

.scene {
    opacity: 0;
    transform: scale(0.8);
    animation: showScene 3s forwards;
}

.scene1 {
    animation-delay: 0s;
}

.scene2 {
    animation-delay: 4s;
}

.scene3 {
    animation-delay: 8s;
}

.scene4 {
    animation-delay: 12s;
}

.big {
    font-size: 55px;
}

h1 {
    color: #087ca8;
    font-size: 35px;
}

h2 {
    color: #168ab5;
    font-size: 27px;
}

p {
    color: #4b8da8;
    font-size: 20px;
}

@keyframes showScene {

    0% {
        opacity: 0;
        transform: scale(0.8);
    }

    25% {
        opacity: 1;
        transform: scale(1);
    }

    70% {
        opacity: 1;
        transform: scale(1);
    }

    100% {
        opacity: 0;
        transform: scale(1.1);
    }
}

.final {
    animation: finalShow 3s forwards;
    animation-delay: 12s;
    opacity: 0;
}

@keyframes finalShow {

    from {
        opacity: 0;
        transform: scale(0.7);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

.heart {
    font-size: 55px;
    animation: heartbeat 1s infinite;
}

@keyframes heartbeat {

    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.2);
    }
}

</style>
</head>

<body>

<div class="movie">

    <div class="scene scene1">
        <div class="big">🎬</div>
        <h1>OUR LOVE STORY</h1>
        <p>The End?</p>
    </div>

    <div class="scene scene2">
        <div class="big">❤️</div>
        <h2>No...</h2>
        <p>This is only the beginning.</p>
    </div>

    <div class="scene scene3">
        <div class="big">⏳</div>
        <h2>Chapter 4 completed...</h2>
        <p>Chapter 5 loading...</p>
    </div>

    <div class="scene scene4 final">
        <div class="heart">💙</div>

        <h1>OUR STORY CONTINUES...</h1>

        <p>
            Forever is still waiting for us. 🫂♾️
        </p>

        <div class="heart">❤️</div>
    </div>

</div>

</body>
</html>
