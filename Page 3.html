<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Hug 🤗</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Georgia, serif;
    background: linear-gradient(135deg, #dff6ff, #8bd7f7);
}

.card {
    text-align: center;
    width: 90%;
    max-width: 420px;
    padding: 50px 25px;
    background: rgba(255,255,255,0.85);
    border-radius: 30px;
    box-shadow: 0 10px 35px rgba(0,100,160,0.2);
}

.hug {
    font-size: 100px;
    animation: hug 1.5s infinite alternate;
}

@keyframes hug {
    from {
        transform: scale(1) rotate(-5deg);
    }
    to {
        transform: scale(1.15) rotate(5deg);
    }
}

h1 {
    color: #087bb5;
}

p {
    color: #4a99bc;
    font-size: 19px;
}

button {
    border: none;
    background: #38aee8;
    color: white;
    padding: 15px 35px;
    border-radius: 30px;
    font-size: 18px;
}
</style>
</head>

<body>

<div class="card">

    <div class="hug">🤗</div>

    <h1>Little Hug 🩵</h1>

    <p>
        Sending you a little virtual hug... 🫂✨
    </p>

    <button onclick="location.href='page4.html'">
        Next → 💙
    </button>

</div>

</body>
</html>
